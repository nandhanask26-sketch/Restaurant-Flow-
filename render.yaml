services:
  # 1. Backend API & WebSocket Server
  - type: web
    name: restaurantflow-backend
    runtime: node
    plan: free
    rootDir: restaurantflow/backend
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: restaurantflow-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: restaurantflow-frontend
          property: host
          value: https://${host}

  # 2. Frontend SPA + PWA Application
  - type: web
    name: restaurantflow-frontend
    runtime: static
    rootDir: restaurantflow/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: restaurantflow-backend
          property: host
          value: https://${host}/api
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: restaurantflow-backend
          property: host
          value: https://${host}

databases:
  # 3. Free Managed Cloud PostgreSQL
  - name: restaurantflow-db
    plan: free
    databaseName: restaurantflow
    user: restaurantflow_user
